<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1800 Soles | Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page="inventory">
  <aside class="sidebar">
    <div class="brand"><i class="fa-solid fa-bread-slice"></i> 1800 SOLES</div>
    <div class="menu">
      <a data-page="home" href="/home.html"><i class="fa fa-house"></i> HOME</a>
      <a data-page="inventory" class="active" href="/inventory.html"><i class="fa fa-box"></i> INVENTORY</a>
      <a data-page="analytics" href="/analytics.html"><i class="fa fa-chart-column"></i> ANALYTICS</a>
      <a data-page="settings" href="/settings.html"><i class="fa fa-gear"></i> SETTINGS</a>
    </div>
    <div class="logout">
      <button id="logoutBtn"><i class="fa fa-right-from-bracket"></i> LOG OUT</button>
    </div>
  </aside>

  <main class="content">
    <h1 class="page-title center-title">Inventory Management</h1>
    <p class="page-sub center-sub">Track and manage your stock levels</p>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="inventoryList">Inventory</button>
      <button class="tab-btn" data-tab="activityLog">Activity Log</button>
    </div>
    <div id="inventoryList">
      <div class="search-row">
        <input id="searchInput" placeholder="Search by item name, colorway, brand, or SKU...">
        <button class="outlined-btn" id="editToggle">EDIT</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ITEM NAME</th>
              <th>COLORWAY</th>
              <th>QTY</th>
              <th>LAST MOVEMENT</th>
              <th>STATUS</th>
              <th>ACTION</th>
            </tr>
          </thead>
          <tbody id="itemsTable"></tbody>
        </table>
      </div>
      <div class="floating-bar">
        <button class="outlined-btn" id="downloadCsv"><i class="fa fa-file-arrow-down"></i> Download CSV File</button>
        <button class="outlined-btn" id="editItemBtn"><i class="fa fa-pen"></i> EDIT ITEM</button>
        <button class="solid-btn" id="addItemBtn"><i class="fa fa-plus"></i> ADD ITEM</button>
      </div>
    </div>
    <div id="activityLog" style="display:none;">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>DATE/TIME</th>
              <th>ITEM</th>
              <th>ACTION</th>
              <th>QUANTITY</th>
              <th>SOLD PRICE</th>
            </tr>
          </thead>
          <tbody id="activityTable"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="genericModal"></div></div>
  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
